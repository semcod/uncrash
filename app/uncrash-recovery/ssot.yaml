{
  "schema": "wellmanifest.ssot/v1",
  "app_id": "uncrash-recovery",
  "network": {
    "port_env": "UNCRASH_APX_PORT",
    "bind": "127.0.0.1"
  },
  "endpoints": {
    "health": "/health",
    "registry": "/api/registry",
    "sessions": "/api/sessions",
    "backend": "/api/backend",
    "transfer_plan": "/api/transfer/plan",
    "transfer_apply": "/api/transfer/apply"
  },
  "governance": {
    "owner": "semcod/uncrash",
    "standard": "urn:wellmanifest:spec:apx:v1"
  },
  "backend_env": "UNCRASH_APX_BACKEND_URL"
}
